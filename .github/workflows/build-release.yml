name: Build and release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-master
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare git history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git remote add upstream https://github.com/Zrips/Residence.git
          git fetch --no-tags upstream master

      - name: Decide build
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("pom.xml").getroot()
          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          version = root.findtext("m:version", namespaces=namespace) or root.findtext("version")
          if not version:
              raise SystemExit("Unable to read project version from pom.xml")
          print(version.strip())
          PY
          )"

          LATEST_VERSION_TAG="$(git tag --list '[0-9]*.[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
          UPSTREAM_VERSION_CHANGED=false
          if [ -z "$LATEST_VERSION_TAG" ] || [ "$LATEST_VERSION_TAG" != "$VERSION" ]; then
            UPSTREAM_VERSION_CHANGED=true
          fi

          mkdir -p .release

          if [ -n "$LATEST_VERSION_TAG" ]; then
            LOCAL_COMMITS="$(git log --reverse --no-merges --format='- %h %s' "$LATEST_VERSION_TAG..HEAD" --not upstream/master || true)"
          else
            LOCAL_COMMITS="$(git log --reverse --no-merges --format='- %h %s' HEAD --not upstream/master || true)"
          fi

          if [ -n "$LOCAL_COMMITS" ]; then
            HAS_LOCAL_COMMITS=true
            printf '%s\n' "$LOCAL_COMMITS" > .release/local-commits.md
          else
            HAS_LOCAL_COMMITS=false
            : > .release/local-commits.md
          fi

          if [ "$UPSTREAM_VERSION_CHANGED" = true ] || [ "$HAS_LOCAL_COMMITS" = true ]; then
            SHOULD_BUILD=true
          else
            SHOULD_BUILD=false
          fi

          {
            echo "version=$VERSION"
            echo "latest_version_tag=$LATEST_VERSION_TAG"
            echo "upstream_version_changed=$UPSTREAM_VERSION_CHANGED"
            echo "has_local_commits=$HAS_LOCAL_COMMITS"
            echo "should_build=$SHOULD_BUILD"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch SpigotMC release notes
        if: steps.decide.outputs.should_build == 'true' && steps.decide.outputs.upstream_version_changed == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import json
          import re
          import sys
          import urllib.request
          from pathlib import Path

          RESOURCE_ID = 11480
          VERSION = __import__("os").environ["VERSION"]
          API = "https://api.spiget.org/v2"

          def load_json(url):
              request = urllib.request.Request(url, headers={"User-Agent": "Residence-release-workflow"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          def clean(value):
              value = html.unescape(value or "")
              value = re.sub(r"(?i)<br\s*/?>", "\n", value)
              value = re.sub(r"(?i)</p\s*>", "\n", value)
              value = re.sub(r"<[^>]+>", "", value)
              value = re.sub(r"\[[^\]]+\]", "", value)
              lines = [re.sub(r"[ \t]+", " ", line).strip() for line in value.splitlines()]
              lines = [line for line in lines if line]
              return "\n".join(lines).strip()

          updates = load_json(f"{API}/resources/{RESOURCE_ID}/updates?size=1000&sort=-date")
          if isinstance(updates, dict) and "data" in updates:
              updates = updates["data"]

          matches = []
          for update in updates:
              title = str(update.get("title") or update.get("name") or "")
              description = str(update.get("description") or update.get("content") or "")
              if VERSION in title or VERSION in description:
                  matches.append(update)

          note = ""
          for update in matches:
              detail = update
              update_id = update.get("id")
              if update_id is not None:
                  try:
                      detail = load_json(f"{API}/resources/{RESOURCE_ID}/updates/{update_id}")
                  except Exception:
                      detail = update

              title = clean(str(detail.get("title") or detail.get("name") or ""))
              body = clean(str(detail.get("description") or detail.get("content") or ""))
              if body:
                  note = body
              elif title:
                  note = title
              if note:
                  break

          if not note:
              sys.exit(f"Unable to fetch SpigotMC update notes for version {VERSION}")

          Path(".release/upstream-notes.md").write_text(note + "\n", encoding="utf-8")
          PY

      - name: Compose release notes
        if: steps.decide.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          : > .release/release-notes.md

          if [ -s .release/upstream-notes.md ]; then
            cat .release/upstream-notes.md >> .release/release-notes.md
          fi

          if [ -s .release/upstream-notes.md ] && [ -s .release/local-commits.md ]; then
            printf '\n' >> .release/release-notes.md
          fi

          if [ -s .release/local-commits.md ]; then
            cat .release/local-commits.md >> .release/release-notes.md
          fi

          if [ ! -s .release/release-notes.md ]; then
            echo "Release notes are empty" >&2
            exit 1
          fi

      - name: Set up Java
        if: steps.decide.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        if: steps.decide.outputs.should_build == 'true'
        shell: bash
        run: mvn -B -DskipTests package

      - name: Publish release
        if: steps.decide.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.decide.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          JAR="target/Residence${VERSION}.jar"
          if [ ! -f "$JAR" ]; then
            echo "Expected artifact not found: $JAR" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$VERSION" "$GITHUB_SHA"
          git push --force origin "refs/tags/$VERSION"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes-file .release/release-notes.md
            gh release upload "$VERSION" "$JAR" --clobber
          else
            gh release create "$VERSION" "$JAR" --title "$VERSION" --notes-file .release/release-notes.md
          fi

      - name: Skip build
        if: steps.decide.outputs.should_build != 'true'
        shell: bash
        run: echo "No upstream version change or local independent commits; skipping build."
